# CI — roda os testes em todo push (qualquer branch) e em PRs para a main.
# Os nomes dos jobs são os "status checks" exigidos na proteção da branch main.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unitarios-linux:
    name: unitarios-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # A produção pode ser um PC Windows: os testes rodam lá também.
  unitarios-windows:
    name: unitarios-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Sobe uma Argus falsa e roda o rodízio de verdade (15 cenários).
  cenarios:
    name: cenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cenarios

  # Interface do painel (painel-web/: React + TypeScript + Tailwind): tipos, testes
  # e build. O build fica no git (src/painel/publico): tem de estar em dia com o código.
  painel-web:
    name: painel-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: painel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Build no git em dia com o código
        run: |
          git status --porcelain -- ../src/painel/publico
          if [ -n "$(git status --porcelain -- ../src/painel/publico)" ]; then
            echo "::error::src/painel/publico está desatualizado: rode 'npm run painel:build' e faça commit do resultado."
            exit 1
          fi
