# Cloudflare Tunnel do painel: https://benura-api.benconsig.com.br → o benura-painel deste servidor.
# A página fica no Cloudflare Pages (https://benura.benconsig.com.br) e a Function dela
# (functions/api) chama este endereço. README: "Servidor + Cloudflare Pages".
#
# O jeito mais simples é criar o túnel pelo painel da Cloudflare (Zero Trust → Networks →
# Tunnels) e rodar no servidor o comando de instalação que ele mostra: aí este arquivo não
# é necessário. Para configurar por arquivo, copie para C:\Users\<usuário>\.cloudflared\config.yml,
# troque <ID-DO-TUNEL> e <USUÁRIO> e rode "cloudflared service install".
# Nada aqui é segredo; o arquivo de credenciais (<ID-DO-TUNEL>.json) NUNCA vai para o git.
tunnel: <ID-DO-TUNEL>
credentials-file: C:\Users\<USUÁRIO>\.cloudflared\<ID-DO-TUNEL>.json

ingress:
  # Só o painel vai para a internet. Roteador, rodízio e rotinas continuam só no localhost.
  - hostname: benura-api.benconsig.com.br
    service: http://localhost:3010
  - service: http_status:404
